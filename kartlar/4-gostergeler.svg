<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="Profil göstergeleri">
  <title>Profil göstergeleri</title>
  <defs>
    
    <radialGradient id="leke0" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leke1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leke2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8957e5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dis"><rect x="1" y="1" width="838" height="228" rx="18"/></clipPath>
    <linearGradient id="kenar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3fb950" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <style>
    .s{font-family:'Segoe UI', Inter, Ubuntu, 'Helvetica Neue', Arial, sans-serif}
    .m{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', monospace}
    .kay{animation:kay 14s ease-in-out infinite}
    .kay1{animation-duration:18s;animation-direction:reverse}
    .kay2{animation-duration:22s}
    @keyframes kay{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,12px)}}
    @keyframes belir{from{opacity:0}to{opacity:1}}
    @keyframes yanip{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes nabiz{0%,100%{opacity:1}50%{opacity:.35}}
    .imlec{animation:yanip 1.1s steps(1) infinite}
    .nabiz{animation:nabiz 2.4s ease-in-out infinite}
    .kutu{animation:belir .6s ease-out both}
    .bar{transform-box:fill-box;transform-origin:left;animation:doldur 1.4s cubic-bezier(.2,.8,.2,1) both}
    @keyframes doldur{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x="1" y="1" width="838" height="228" rx="18" fill="#0b0f15"/>
  <g clip-path="url(#dis)"><ellipse class="kay kay0" cx="120" cy="30" rx="230" ry="138" fill="url(#leke0)"/><ellipse class="kay kay1" cx="680" cy="40" rx="230" ry="138" fill="url(#leke1)"/><ellipse class="kay kay2" cx="520" cy="230" rx="230" ry="138" fill="url(#leke2)"/></g>
  <rect x="1" y="1" width="838" height="228" rx="18" fill="none" stroke="url(#kenar)" stroke-width="1.2"/>
  <rect x="22" y="22" width="796" height="186" rx="14" fill="#0d1117" fill-opacity="0.55" stroke="#58a6ff" stroke-opacity="0.32"/>
  
  <text class="s" x="46" y="64" font-size="24" font-weight="800" fill="#f0f6fc">Profil Göstergeleri</text>
  <text class="s" x="46" y="86" font-size="12" fill="#8b949e">GitHub verileriyle her gün kendiliğinden güncellenir</text>
  <circle class="nabiz" cx="806" cy="44" r="4" fill="#58a6ff"/>
  <g class="kutu" style="animation-delay:0.00s">
      <rect x="46" y="106" width="176.5" height="84" rx="12" fill="#0d1117" fill-opacity="0.7" stroke="#58a6ff" stroke-opacity="0.35"/>
      <text class="s" x="62" y="131" font-size="12.5" font-weight="700" fill="#c9d1d9">Yıldız</text>
      <text class="s" x="208.5" y="131" text-anchor="end" font-size="9.5" fill="#6e7681">hedef 1.000</text>
      <text class="s" x="62" y="164" font-size="30" font-weight="800" fill="#58a6ff">826</text>
      <rect x="62" y="174" width="144.5" height="5" rx="2.5" fill="#21262d"/>
      <rect class="bar" style="animation-delay:0.30s" x="62" y="174" width="119.4" height="5" rx="2.5" fill="#58a6ff"/>
    </g><g class="kutu" style="animation-delay:0.12s">
      <rect x="236.5" y="106" width="176.5" height="84" rx="12" fill="#0d1117" fill-opacity="0.7" stroke="#58a6ff" stroke-opacity="0.35"/>
      <text class="s" x="252.5" y="131" font-size="12.5" font-weight="700" fill="#c9d1d9">Katkı</text>
      <text class="s" x="399" y="131" text-anchor="end" font-size="9.5" fill="#6e7681">hedef 500</text>
      <text class="s" x="252.5" y="164" font-size="30" font-weight="800" fill="#39c5cf">372</text>
      <rect x="252.5" y="174" width="144.5" height="5" rx="2.5" fill="#21262d"/>
      <rect class="bar" style="animation-delay:0.42s" x="252.5" y="174" width="107.5" height="5" rx="2.5" fill="#39c5cf"/>
    </g><g class="kutu" style="animation-delay:0.24s">
      <rect x="427" y="106" width="176.5" height="84" rx="12" fill="#0d1117" fill-opacity="0.7" stroke="#58a6ff" stroke-opacity="0.35"/>
      <text class="s" x="443" y="131" font-size="12.5" font-weight="700" fill="#c9d1d9">Depo</text>
      <text class="s" x="589.5" y="131" text-anchor="end" font-size="9.5" fill="#6e7681">hedef 50</text>
      <text class="s" x="443" y="164" font-size="30" font-weight="800" fill="#a371f7">29</text>
      <rect x="443" y="174" width="144.5" height="5" rx="2.5" fill="#21262d"/>
      <rect class="bar" style="animation-delay:0.54s" x="443" y="174" width="83.8" height="5" rx="2.5" fill="#a371f7"/>
    </g><g class="kutu" style="animation-delay:0.36s">
      <rect x="617.5" y="106" width="176.5" height="84" rx="12" fill="#0d1117" fill-opacity="0.7" stroke="#58a6ff" stroke-opacity="0.35"/>
      <text class="s" x="633.5" y="131" font-size="12.5" font-weight="700" fill="#c9d1d9">Takipçi</text>
      <text class="s" x="780" y="131" text-anchor="end" font-size="9.5" fill="#6e7681">hedef 250</text>
      <text class="s" x="633.5" y="164" font-size="30" font-weight="800" fill="#3fb950">230</text>
      <rect x="633.5" y="174" width="144.5" height="5" rx="2.5" fill="#21262d"/>
      <rect class="bar" style="animation-delay:0.66s" x="633.5" y="174" width="132.9" height="5" rx="2.5" fill="#3fb950"/>
    </g>
  <text class="s" x="822" y="222" text-anchor="end" font-size="9" fill="#6e7681">github.com/huseyingunes</text>
</svg>