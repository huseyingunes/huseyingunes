name: Profil kartları

on:
  schedule:
    - cron: "17 3 * * *"   # her gün 06:17 (TSİ)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "ayarlar.json"]

permissions:
  contents: write

jobs:
  kartlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kartları üret
        env:
          # Özel katkıların da sayılması için PROFIL_TOKEN gizli anahtarı tanımlanmalı
          GH_TOKEN: ${{ secrets.PROFIL_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/olustur.mjs
      - name: Değişiklikleri gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kartlar
          git diff --cached --quiet || git commit -m "Profil kartları güncellendi"
          git push
